<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서부의 결투 - 온라인 카드게임</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>🤠 서부의 결투</h1><p>4~7인 실시간 카드게임 · BANG! 기본 규칙 연습용</p></header><section id="login" class="panel"><h2>게임 시작</h2><input id="nickname" maxlength="14" placeholder="닉네임"><div class="actions"><button id="create">방 만들기</button><input id="roomCode" maxlength="6" placeholder="방코드 6자리"><button id="join">방 입장</button></div><p id="notice"></p></section><section id="game" hidden><div class="panel"><h2>방 코드 <span id="code"></span></h2><p id="status"></p><div id="players"></div><div class="actions"><button id="addBot" hidden>🤖 봇 추가</button><button id="removeBot" hidden>봇 제거</button><button id="start" hidden>게임 시작 (방장)</button></div><p class="hint">혼자 플레이하려면 봇 3명 이상 추가 후 시작하세요. 봇은 방장 브라우저가 열려 있을 때 움직입니다.</p></div><section id="table" hidden><div class="panel"><h2>내 정보</h2><p id="myinfo"></p><p id="phase"></p><div id="hand"></div><button id="draw">카드 2장 뽑기</button><button id="end">턴 종료</button></div><div class="panel"><h2>다른 플레이어</h2><div id="targets"></div></div><div class="panel"><h2>게임 기록</h2><div id="log"></div></div></section></section></main><script type="module" src="app.js"></script></body></html>
